<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuseok Presentation for Toddlers</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .slideshow-container {
            max-width: 90%;
            max-height: 90vh;
            position: relative;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slide {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s;
            width: 100%;
        }

        .slide.active {
            display: block;
        }

        .image-placeholder {
            width: 600px;
            height: 400px;
            max-width: 100%;
            background: #f0f0f0;
            border: 3px dashed #5a67d8;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 1.2em;
            color: #5a67d8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .image-placeholder svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            fill: #5a67d8;
        }

        .slide-title {
            font-size: 2.5em;
            color: #5a67d8;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .slide-description {
            font-size: 1.3em;
            color: #4a5568;
            margin: 15px 0;
            line-height: 1.6;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-button {
            background: #5a67d8;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(90, 103, 216, 0.3);
        }

        .slide-image {
            overflow: auto;
        }

        .nav-button:hover {
            background: #4c51bf;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(90, 103, 216, 0.4);
        }

        .nav-button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .slide-counter {
            font-size: 1.2em;
            color: #4a5568;
            padding: 10px 20px;
            background: #e2e8f0;
            border-radius: 20px;
        }

        .slide-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #cbd5e0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: #5a67d8;
            transform: scale(1.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .instructions {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            max-width: 800px;
        }

        .instructions h3 {
            color: #5a67d8;
            margin-top: 0;
        }

        .instructions ul {
            text-align: left;
            color: #4a5568;
            line-height: 1.8;
        }

        /* Emoji decorations for each slide */
        .moon-emoji {
            font-size: 4em;
            animation: float 3s ease-in-out infinite;
        }

        .rabbit-emoji {
            font-size: 4em;
            animation: hop 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes hop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="slideshow-container">
        <div id="slides-wrapper">
            <!-- Slides will be dynamically inserted here -->
        </div>
        
        <div class="controls">
            <button class="nav-button" id="prevBtn" onclick="changeSlide(-1)">◀ Previous</button>
            <div class="slide-counter">
                <span id="current-slide">1</span> / <span id="total-slides">9</span>
            </div>
            <button class="nav-button" id="nextBtn" onclick="changeSlide(1)">Next ▶</button>
        </div>
        
        <div class="slide-indicator" id="indicator">
            <!-- Dots will be dynamically inserted here -->
        </div>
    </div>

    <script>
        let currentSlide = 0;
        
        const slidesData = [
            {
                title: "Welcome to Chuseok! 🌕",
                description: "Today we're learning about Korea's special moon holiday!",
                placeholder: "Add a Chuseok celebration image here",
                image: "https://freevector-images.s3.amazonaws.com/uploads/vector/preview/70141/vecteezymid-autumn-festival-chuseok-illustrationgb0721_generated.jpg",
                emoji: "🎊"
            },
            {
                title: "Korea on the Map 🇰🇷",
                description: "Can you find it on the map?",
                placeholder: "Add Korean flag or map image here",
                image: "https://t4.ftcdn.net/jpg/02/74/59/79/360_F_274597914_4aetfu1gWRK2M6b2lbxKtZb4qibho30j.jpg",
                emoji: "🗺️"
            },
            {
                title: "The Big Round Moon 🌕",
                description: "Chuseok happens when the moon is big and round!",
                placeholder: "Add full moon image here",
                emoji: "🌕",
                special: "moon",
                image: "https://images.vexels.com/content/124971/preview/illustrated-moon-phases-730a86.png"
            },
            {
                title: "Family Time! 👨‍👩‍👧‍👦",
                description: "Families come together to eat yummy food and say thank you",
                placeholder: "Add Korean family gathering image here",
                emoji: "🏠",
                image: "https://ccdn.yohomobile.com/uploads/A_vibrant_scene_of_a_traditional_Korean_family_gathered_around_a_table_for_Chuseok_1024x585_7ab7a5bc62.webp"
            },
            {
                title: "Special Moon Cakes - Songpyeon 🍡",
                description: "We make colorful rice cakes! They're shaped like half moons!",
                placeholder: "Add colorful songpyeon image here",
                emoji: "🍡",
                image: "https://www.korea.net/upload/content/editImage/Songpyeon_Seoul_5colors_L1.jpg"
            },
            {
                title: "The Moon Rabbit Story 🐰",
                description: "Can you see the rabbit in the moon? He makes rice cakes!",
                placeholder: "Add moon rabbit illustration here",
                emoji: "🐰",
                special: "rabbit",
                image: "https://cdn.shopify.com/s/files/1/0709/4185/files/rabbit_in_moon_grande.gif?v=1474446532"
            },
            {
                title: "Rabbit Making Rice Cakes 🥮",
                description: "The kind rabbit pounds rice to make special treats!",
                placeholder: "Add rabbit pounding rice cakes image here",
                emoji: "🐇",
                image: "https://thumb.ac-illust.com/08/0814a10fa31a90d3e3b79ea4bed1dd7b_t.jpeg"
            },
            {
                title: "Pretty Clothes - Hanbok 👘",
                description: "Korean children wear colorful special clothes!",
                placeholder: "Add hanbok image here",
                emoji: "👘",
                image: "https://lh3.googleusercontent.com/pw/AP1GczP7SXJ-1f580vIoSnHs5cSUnAYc9q9aKZJpEc7GV-BTHVc5MdGJDJDgkj_s1VGhLnTdz2uIropiBnM9QZ9vi8orscXndMFZiD_0v2dao7L83ivLxZLR6_b6IDZFoDM4ViCevV89VSP51mjm9tw0XS81=w1204-h1599-s-no-gm?authuser=0"
            },
            {
                title: "Circle Dance Time! 💃",
                description: "Let's hold hands and dance in a circle under the moon!",
                placeholder: "Add circle dance or children in hanbok image here",
                emoji: "🎵",
                image: "https://www.urbanbrush.net/web/wp-content/uploads/edd/2018/03/web-20180325075023757688.png"
            }
        ];

        function initializeSlideshow() {
            const slidesWrapper = document.getElementById('slides-wrapper');
            const indicator = document.getElementById('indicator');
            
            // Create slides
            slidesData.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;
                
                let emojiClass = '';
                if (slide.special === 'moon') emojiClass = 'moon-emoji';
                if (slide.special === 'rabbit') emojiClass = 'rabbit-emoji';
                
                slideDiv.innerHTML = `
                    <h2 class="slide-title">${slide.title}</h2>
                    <div class="image-placeholder">
                        <img src="${slide.image}" class="slide-image" />
                    </div>
                    <p class="slide-description">${slide.description}</p>
                `;
                slidesWrapper.appendChild(slideDiv);
                
                // Create dot indicator
                const dot = document.createElement('div');
                dot.className = `dot ${index === 0 ? 'active' : ''}`;
                dot.onclick = () => goToSlide(index);
                indicator.appendChild(dot);
            });
            
            // Add instructions slide at the end
            const instructionsSlide = document.createElement('div');
            instructionsSlide.className = 'slide';
            instructionsSlide.innerHTML = `
                <div class="instructions">
                    <h3>📸 How to Add Your Images:</h3>
                    <ul>
                        <li><strong>Save this HTML file</strong> to your computer</li>
                        <li><strong>Create a folder</strong> with your presentation images</li>
                        <li><strong>Name your images</strong> (e.g., slide1.jpg, slide2.jpg)</li>
                        <li><strong>Edit the HTML</strong> to replace placeholder divs with:<br>
                            <code>&lt;img src="your-image.jpg" style="max-width: 100%; height: auto; border-radius: 15px;"&gt;</code></li>
                        <li><strong>Or use online images</strong> from sites like Pixabay or Unsplash</li>
                    </ul>
                    <p><strong>Tip:</strong> For best results, use colorful, simple images that toddlers will enjoy!</p>
                </div>
            `;
            slidesWrapper.appendChild(instructionsSlide);
            
            document.getElementById('total-slides').textContent = slidesData.length;
            updateButtons();
        }

        function showSlide(n) {
            const slides = document.getElementsByClassName('slide');
            const dots = document.getElementsByClassName('dot');
            
            if (n >= slides.length) currentSlide = 0;
            if (n < 0) currentSlide = slides.length - 1;
            
            for (let i = 0; i < slides.length; i++) {
                slides[i].classList.remove('active');
                if (dots[i]) dots[i].classList.remove('active');
            }
            
            slides[currentSlide].classList.add('active');
            if (dots[currentSlide]) dots[currentSlide].classList.add('active');
            document.getElementById('current-slide').textContent = currentSlide + 1;
            
            updateButtons();
        }

        function changeSlide(n) {
            currentSlide += n;
            showSlide(currentSlide);
        }

        function goToSlide(n) {
            currentSlide = n;
            showSlide(currentSlide);
        }

        function updateButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slidesData.length - 1;
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });

        // Initialize on load
        window.onload = initializeSlideshow;
    </script>
</body>
</html>
